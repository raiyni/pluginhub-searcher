<!DOCTYPE html>
<html>

<head>
	<meta charset="utf8" />
	<title>Pluginhub searcher</title>

	<style>
		body {
			margin: 0;
			min-height: 100vh;
			font-family: system-ui, sans-serif;
		}

		#app {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			padding: 1rem;
			box-sizing: border-box;
		}

		.content {
			flex: 1;
		}

		.footer {
			margin-top: 2rem;
			padding-top: 0.75rem;
			border-top: 1px solid #ddd;
			font-size: 0.9em;
			color: #666;
		}

		.error {
			background-color: rgba(255, 0, 0, 0.35);
			padding: 0.25rem 0.5rem;
			margin: 0.25rem 0;
			border-radius: 3px;
		}

		.search {
			margin-bottom: 2em;
		}

		.search > input {
			width: calc(100% - 2em);
			font-family: monospace;
			padding: 0.4em 0.6em;
			font-size: 1em;
		}

		.results {
			margin-top: 0.5em;
		}

		.plugins {
			margin-bottom: 0.75em;
		}

		.plugin {
			font-family: monospace;
			cursor: pointer;
			margin-right: 0.75em;
			white-space: nowrap;
		}

		.noselect {
			user-select: none;
			color: #666;
		}

		.lines {
			max-height: 60vh;
			overflow-y: auto;
			border: 1px solid #eee;
			border-radius: 4px;
			padding: 0.25em 0.5em;
		}

		.line {
			font-family: monospace;
			font-size: 0.9em;
			padding: 0.1em 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.line a {
			text-decoration: none;
		}

		.line code {
			white-space: pre;
		}

		.muted {
			color: #999;
			margin-left: 0.75em;
		}

		.note {
			color: #666;
			font-size: 0.85em;
			margin-top: 0.25em;
		}
	</style>
</head>

<body>
<div id="app">
	Loading...
</div>

<script type="module" src="app.js"></script>
</body>
</html>
